# Socle des tests d integration : le planificateur d abandon automatique (4.8) est desactive pour tous les contextes
# Spring ; les tests qui en dependent l activent explicitement (properties = backyard.abandon-automatique.actif=true).
backyard.abandon-automatique.actif=false

# Les contextes Spring mis en cache sont plus de trente a la fin de la suite, et leur fermeture sequentielle par le crochet
# d arret de la JVM (base deja arretee, Hikari attend a chaque fois) depasse les 30 s accordees par failsafe. Les
# conteneurs sont de toute facon detruits par Testcontainers : on laisse la JVM sortir sans fermer les contextes.
spring.main.register-shutdown-hook=false

# 7.3 RG2 : les tests d integration appellent l api en HTTP ; seul le test des cookies Secure passe la propriete a true.
server.servlet.session.cookie.secure=false

# 8.4 RG15 : les contextes mis en cache partagent le registre des echecs par adresse et tous les tests viennent de la
# meme adresse : le plafond est releve pour qu ils ne cumulent pas leurs echecs. Les tests du plafond posent leurs valeurs.
backyard.connexion.echecs-par-ip-max=1000
