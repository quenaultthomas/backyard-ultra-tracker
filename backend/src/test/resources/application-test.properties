# Test profile - H2 en mode PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Laisser Flyway créer le schéma, Hibernate valide uniquement
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Comptes de test de l'API (RG32 inc. 3), uniquement dans les ressources de test.
# Hash BCrypt de cout 4 : admin-test / admin-secret, scanner-test / scanner-secret.
backyard.security.admin.username=admin-test
backyard.security.admin.password-hash=$2a$04$y5qZCIAHUZJzXkawr/klsep.f6zWCD7ErOpuAVwd.gwAalNLmDGZi
backyard.security.scanner.username=scanner-test
backyard.security.scanner.password-hash=$2a$04$OfMV7IR5R5uA64IgejaHN.NPGO6M507T2FWM7.j/113nmUPHwnxg2

# Pas de cloture periodique des yards pendant les tests
backyard.scheduling.enabled=false
