# Connexion a la base : fournie exclusivement par variables d'environnement
# (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD).
# Aucun identifiant n'est code en dur ici.
spring:
  application:
    name: backyard-ultra-tracker
  autoconfigure:
    # Les comptes sont en base : pas d'utilisateur en memoire ni de mot de passe genere dans les logs.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    hikari:
      # Base injoignable : echec rapide (health DOWN en ~5 s au lieu de 30 s).
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      # Logo de course : 2 Mo par fichier (2 x 1024 x 1024, meme limite que le domaine), marge pour l'enveloppe.
      # Depassement : 413 LOGO_TROP_VOLUMINEUX. Lecture differee : l'erreur survient dans le controleur concerne.
      max-file-size: 2MB
      max-request-size: 3MB
      resolve-lazily: true
  web:
    resources:
      # L'API ne sert aucun fichier statique (le front est servi par Caddy) : un chemin inconnu
      # donne un 404 RESSOURCE_INTROUVABLE, quelle que soit la methode HTTP.
      add-mappings: false

server:
  # Derriere Caddy : X-Forwarded-For est lu (adresse cliente). X-Forwarded-Proto est ignore (7.3 RG2, voir
  # AdresseClienteConfiguration) : le drapeau Secure des cookies ne depend que de cookie.secure.
  forward-headers-strategy: native
  servlet:
    session:
      # Sessions en memoire : un redemarrage de l'api deconnecte tout le monde.
      # Delai par defaut du conteneur seulement : toute session authentifiee recoit a l'ouverture le delai
      # d'inactivite de son role, choisi par PolitiqueSession (backyard.session.*, 8.2 RG5).
      timeout: 12h
      # Identifiant de session uniquement par cookie, jamais dans l'URL.
      tracking-modes: cookie
      cookie:
        name: JSESSIONID
        path: /
        http-only: true
        same-site: lax
        # Drapeau Secure de JSESSIONID, XSRF-TOKEN et du cookie de session efface (7.3 RG2), independant de
        # X-Forwarded-Proto. Booleen true/false (COOKIES_SECURE), autre valeur : l'api ne demarre pas. Defaut sur :
        # true ; docker-compose.yml passe false (dev et E2E en HTTP), docker-compose.prod.yml impose true.
        secure: ${COOKIES_SECURE:true}

backyard:
  abandon-automatique:
    # Controle chaque seconde des courses en cours (abandon hors delai). Propriete interne, jamais posee par le
    # deploiement : seuls les tests d'integration la passent a false.
    actif: true
  connexion:
    # Limitation des tentatives de connexion par pseudo (entiers >= 1, sinon l'api ne demarre pas) :
    # echecs consecutifs avant blocage, puis duree du blocage et de l'oubli des echecs partiels.
    echecs-max: ${CONNEXION_ECHECS_MAX:5}
    blocage-secondes: ${CONNEXION_BLOCAGE_SECONDES:900}
    # Plafond d'echecs de connexion par adresse cliente (8.4, SEC-14), fenetre glissante : au plus echecs-par-ip-max
    # echecs (entier 1 a 1000) par echecs-par-ip-fenetre-secondes (entier 1 a 3600) ; au-dela, 429 identique au
    # blocage par pseudo. Valeur invalide : l'api ne demarre pas. Compteur en memoire, jamais remis a zero par un succes.
    echecs-par-ip-max: ${CONNEXION_ECHECS_PAR_IP_MAX:20}
    echecs-par-ip-fenetre-secondes: ${CONNEXION_ECHECS_PAR_IP_FENETRE_SECONDES:60}
  session:
    # Delai d'inactivite de session par role (secondes, entiers de 1 a 604800, administrateurs <= autres), sinon
    # l'api ne demarre pas. Glissant : chaque requete authentifiee le repousse. Regle dans PolitiqueSession.
    inactivite-admin-secondes: ${SESSION_INACTIVITE_ADMIN_SECONDES:7200}
    inactivite-coureur-benevole-secondes: ${SESSION_INACTIVITE_COUREUR_BENEVOLE_SECONDES:43200}
  hachage:
    # Plafond des calculs Argon2id simultanes (connexion, creation de compte, changement de mot de passe) :
    # environ 19 Mio de memoire chacun. Au-dela, attente bornee puis 503 SERVICE_SATURE (SEC-06).
    concurrence-max: ${HACHAGE_CONCURRENCE_MAX:4}
    # Plafond par adresse cliente (7.3 RG3), applique avant le plafond global : une adresse n'occupe jamais plus de
    # places. Entier >= 1, sinon l'api ne demarre pas. A relever si des benevoles derriere un meme wifi recoivent 503.
    concurrence-max-par-ip: ${HACHAGE_CONCURRENCE_MAX_PAR_IP:1}
    attente-max-millisecondes: 1000
  limite-debit-public:
    # GET /api/courses et /api/courses/** : requetes par IP et par minute (fenetre fixe), refus 429 TROP_DE_REQUETES
    # au-dela. Entier >= 0, 0 = aucune limite ; valeur invalide : l'api ne demarre pas. Defaut 1200 (~60 ecrans de
    # suivi a 20 requetes/minute derriere une meme IP).
    par-minute: ${BACKYARD_LIMITE_DEBIT_PUBLIC_PAR_MINUTE:1200}
    # Nom d'hote (ou adresse) du reverse proxy dont le X-Forwarded-For est retenu pour cette limite et pour le plafond
    # de hachage par adresse ; vide : aucun,
    # l'IP est celle de la connexion. docker-compose.yml le fixe a web (Caddy).
    proxy-de-confiance: ${BACKYARD_PROXY_DE_CONFIANCE:}
  admin-master:
    # Admin master cree au demarrage s'il n'existe pas (ignorees ensuite). Defaut vide : aucun admin cree.
    # Valeurs validees par le domaine (pseudo 3 a 30 caracteres, mot de passe 12 a 128), jamais journalisees.
    pseudo: ${ADMIN_MASTER_PSEUDO:}
    mot-de-passe: ${ADMIN_MASTER_MOT_DE_PASSE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # /actuator/info (alias public /api/version) : uniquement la version deployee {"app":{"version":...}},
  # issue de l'argument de build VERSION du Dockerfile. Aucune metadonnee de build exposee (SEC-17).
  info:
    env:
      enabled: true
    build:
      enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
      # Pas de groupes liveness/readiness : la reponse se limite a {"status":"UP"}.
      probes:
        enabled: false

info:
  app:
    version: ${APP_VERSION:dev}
