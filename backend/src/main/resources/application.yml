# Connexion a la base : fournie exclusivement par variables d'environnement
# (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD).
# Aucun identifiant n'est code en dur ici.
spring:
  application:
    name: backyard-ultra-tracker
  autoconfigure:
    # Les comptes sont en base : pas d'utilisateur en memoire ni de mot de passe genere dans les logs.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    hikari:
      # Base injoignable : echec rapide (health DOWN en ~5 s au lieu de 30 s).
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      # Logo de course : 2 Mo par fichier (2 x 1024 x 1024, meme limite que le domaine), marge pour l'enveloppe.
      # Depassement : 413 LOGO_TROP_VOLUMINEUX. Lecture differee : l'erreur survient dans le controleur concerne.
      max-file-size: 2MB
      max-request-size: 3MB
      resolve-lazily: true
  web:
    resources:
      # L'API ne sert aucun fichier statique (le front est servi par Caddy) : un chemin inconnu
      # donne un 404 RESSOURCE_INTROUVABLE, quelle que soit la methode HTTP.
      add-mappings: false

server:
  # Derriere Caddy : X-Forwarded-Proto rend la requete HTTPS, et les cookies XSRF-TOKEN et JSESSIONID Secure.
  forward-headers-strategy: native
  servlet:
    session:
      # Sessions en memoire : un redemarrage de l'api deconnecte tout le monde.
      timeout: 12h
      # Identifiant de session uniquement par cookie, jamais dans l'URL.
      tracking-modes: cookie
      cookie:
        name: JSESSIONID
        path: /
        http-only: true
        same-site: lax
        # Pas de Secure force : pose par Tomcat des que la requete est HTTPS (en-tete X-Forwarded-Proto).

backyard:
  abandon-automatique:
    # Controle chaque seconde des courses en cours (abandon hors delai). Propriete interne, jamais posee par le
    # deploiement : seuls les tests d'integration la passent a false.
    actif: true
  connexion:
    # Limitation des tentatives de connexion par pseudo (entiers >= 1, sinon l'api ne demarre pas) :
    # echecs consecutifs avant blocage, puis duree du blocage et de l'oubli des echecs partiels.
    echecs-max: ${CONNEXION_ECHECS_MAX:5}
    blocage-secondes: ${CONNEXION_BLOCAGE_SECONDES:900}
  hachage:
    # Plafond des calculs Argon2id simultanes (connexion, creation de compte, changement de mot de passe) :
    # environ 19 Mio de memoire chacun. Au-dela, attente bornee puis 503 SERVICE_SATURE (SEC-06).
    concurrence-max: ${HACHAGE_CONCURRENCE_MAX:4}
    attente-max-millisecondes: 1000
  limite-debit-public:
    # GET /api/courses et /api/courses/** : requetes par IP et par minute (fenetre fixe), refus 429 TROP_DE_REQUETES
    # au-dela. Entier >= 0, 0 = aucune limite ; valeur invalide : l'api ne demarre pas. Defaut 1200 (~60 ecrans de
    # suivi a 20 requetes/minute derriere une meme IP).
    par-minute: ${BACKYARD_LIMITE_DEBIT_PUBLIC_PAR_MINUTE:1200}
    # Nom d'hote (ou adresse) du reverse proxy dont le X-Forwarded-For est retenu pour cette limite ; vide : aucun,
    # l'IP est celle de la connexion. docker-compose.yml le fixe a web (Caddy).
    proxy-de-confiance: ${BACKYARD_PROXY_DE_CONFIANCE:}
  admin-master:
    # Admin master cree au demarrage s'il n'existe pas (ignorees ensuite). Defaut vide : aucun admin cree.
    # Valeurs validees par le domaine (pseudo 3 a 30 caracteres, mot de passe 12 a 128), jamais journalisees.
    pseudo: ${ADMIN_MASTER_PSEUDO:}
    mot-de-passe: ${ADMIN_MASTER_MOT_DE_PASSE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # /actuator/info : version du build (pom) et version de l'image déployée (argument de build VERSION du Dockerfile).
  info:
    env:
      enabled: true
  endpoint:
    health:
      show-details: never
      show-components: never
      # Pas de groupes liveness/readiness : la reponse se limite a {"status":"UP"}.
      probes:
        enabled: false

info:
  app:
    version: ${APP_VERSION:dev}
