# Profil de production (RG34 inc. 3, PO24) : l'API n'écoute que sur l'interface locale, derrière
# le reverse proxy qui termine TLS et redirige HTTP vers HTTPS, et prend en compte ses en-têtes X-Forwarded-*.
server.address=127.0.0.1
server.forward-headers-strategy=framework

# Journaux de l'application (RG22 inc. 5) : fichier avec rotation quotidienne par Logback (motif %d{yyyy-MM-dd} :
# une periode = un jour ; %i numerote les fichiers d'une meme journee au-dela de la taille maximale), 6 archives au plus.
# A tout instant, le fichier courant et ses archives couvrent au plus 7 jours calendaires (jour courant + 6).
# Au-dela, les archives sont supprimees, sans archivage. Chemin modifiable par BACKYARD_LOG_FILE.
logging.file.name=${BACKYARD_LOG_FILE:/var/log/backyard-ultra-tracker/application.log}
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.max-history=6
logging.logback.rollingpolicy.clean-history-on-start=true
