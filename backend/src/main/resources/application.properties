spring.application.name=backyard-ultra-tracker

# DataSource - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/backyard_ultra
spring.datasource.username=backyard
spring.datasource.password=backyard
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - schéma géré uniquement par Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Cloture periodique des yards (auto-DNF, fin de course)
backyard.scheduling.enabled=true
backyard.yard-closing.fixed-delay-ms=1000
