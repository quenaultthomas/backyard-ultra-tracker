# Surcharges de production : ne s'utilise qu'en complément de docker-compose.yml.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Requiert Docker Compose >= 2.24 (balise !reset). Variables : voir .env.example.

services:
  base:
    restart: unless-stopped
    # Plafonds mémoire (DEP-05) : la somme des trois doit laisser une marge au système du VPS (voir docs/deploiement.md).
    mem_limit: ${BASE_MEMOIRE_MAX:-512m}
    environment:
      POSTGRES_PASSWORD: ${BASE_MOT_DE_PASSE:?BASE_MOT_DE_PASSE est obligatoire en production (générer avec openssl rand -hex 24)}

  api:
    # Image versionnée construite et testée par la CI (release.yml) : le VPS ne compile jamais.
    image: ghcr.io/quenaultthomas/backyard-ultra-tracker-api:${VERSION:?VERSION doit être défini dans .env}
    # Pas de construction sur le VPS : l'image vient toujours du registre.
    build: !reset null
    restart: unless-stopped
    # La JVM prend 60 % de ce plafond pour son tas (-XX:MaxRAMPercentage=60, backend/Dockerfile), le reste pour la
    # mémoire hors tas (métaspace, piles, tampons). Argon2id : HACHAGE_CONCURRENCE_MAX x 19 Mio au plus (SEC-06) ;
    # HACHAGE_CONCURRENCE_MAX_PAR_IP (hérité de docker-compose.yml, défaut 1) borne la part d'une seule adresse.
    mem_limit: ${API_MEMOIRE_MAX:-1g}
    environment:
      SPRING_DATASOURCE_PASSWORD: ${BASE_MOT_DE_PASSE:?BASE_MOT_DE_PASSE est obligatoire en production (générer avec openssl rand -hex 24)}
      ADMIN_MASTER_PSEUDO: ${ADMIN_MASTER_PSEUDO:?ADMIN_MASTER_PSEUDO est obligatoire en production (pseudo de l'admin master, 3 à 30 caractères)}
      ADMIN_MASTER_MOT_DE_PASSE: ${ADMIN_MASTER_MOT_DE_PASSE:?ADMIN_MASTER_MOT_DE_PASSE est obligatoire en production (12 caractères minimum, générer avec openssl rand -base64 18)}
      # Valeur fixe, jamais lue dans .env : api refuse de démarrer si un profil de test y est combiné.
      BACKYARD_ENVIRONNEMENT: production
      # HTTPS obligatoire : cookies JSESSIONID et XSRF-TOKEN toujours Secure. Valeur fixe, jamais lue dans .env.
      COOKIES_SECURE: "true"
    # Non exposé : joignable uniquement par web via le réseau interne Compose.
    ports: !reset []

  web:
    image: ghcr.io/quenaultthomas/backyard-ultra-tracker-web:${VERSION:?VERSION doit être défini dans .env}
    build: !reset null
    restart: unless-stopped
    mem_limit: ${WEB_MEMOIRE_MAX:-256m}
    environment:
      # Nom d'hôte du site Caddy : active HTTPS et la redirection HTTP vers HTTPS.
      ADRESSE_SITE: ${DOMAINE:?DOMAINE est obligatoire en production (nom de domaine servi en HTTPS, localhost pour un essai local)}
    # Seul point d'entrée publié. Retirer la ligne UDP pour désactiver HTTP/3.
    ports:
      - "443:443"
      - "443:443/udp"
    volumes:
      # Certificats et état de Caddy : conservés entre deux déploiements.
      - donnees-caddy:/data
      - config-caddy:/config
    healthcheck:
      # Le port 80 redirige vers HTTPS : la santé passe par le site interne non publié.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081/"]

volumes:
  donnees-caddy:
  config-caddy:
