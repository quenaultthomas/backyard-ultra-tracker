name: backyard-ultra-tracker

# Journaux Docker bornés pour tous les services (DEP-05) : 5 fichiers de 10 Mo au plus par conteneur, rotation par
# Docker (sinon le pilote json-file grossit sans limite et peut remplir le disque du VPS).
x-journaux: &journaux
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  base:
    image: postgres:17.11-alpine
    logging: *journaux
    environment:
      POSTGRES_DB: ${BASE_NOM:-backyard}
      POSTGRES_USER: ${BASE_UTILISATEUR:-backyard}
      POSTGRES_PASSWORD: ${BASE_MOT_DE_PASSE:-backyard}
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
    logging: *journaux
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://base:5432/${BASE_NOM:-backyard}
      SPRING_DATASOURCE_USERNAME: ${BASE_UTILISATEUR:-backyard}
      SPRING_DATASOURCE_PASSWORD: ${BASE_MOT_DE_PASSE:-backyard}
      # Limitation des tentatives de connexion (entiers >= 1, sinon api ne demarre pas).
      CONNEXION_ECHECS_MAX: ${CONNEXION_ECHECS_MAX:-5}
      CONNEXION_BLOCAGE_SECONDES: ${CONNEXION_BLOCAGE_SECONDES:-900}
      # Plafond d'echecs de connexion par adresse cliente, fenetre glissante (SEC-14) : echecs max (1 a 1000) par
      # fenetre en secondes (1 a 3600) ; au-dela, 429 identique au blocage par pseudo. Valeur invalide : api ne demarre pas.
      CONNEXION_ECHECS_PAR_IP_MAX: ${CONNEXION_ECHECS_PAR_IP_MAX:-20}
      CONNEXION_ECHECS_PAR_IP_FENETRE_SECONDES: ${CONNEXION_ECHECS_PAR_IP_FENETRE_SECONDES:-60}
      # Plafond de creations de Comptes coureur par adresse cliente, fenetre glissante (SEC-15) : tentatives max de
      # POST /api/comptes (1 a 1000) par fenetre en secondes (1 a 3600) ; au-dela, 429 TROP_DE_REQUETES. Valeur
      # invalide : api ne demarre pas.
      CREATION_COMPTE_PAR_IP_MAX: ${CREATION_COMPTE_PAR_IP_MAX:-10}
      CREATION_COMPTE_PAR_IP_FENETRE_SECONDES: ${CREATION_COMPTE_PAR_IP_FENETRE_SECONDES:-60}
      # Delai d'inactivite de session par role, en secondes (1 a 604800, administrateurs <= autres).
      SESSION_INACTIVITE_ADMIN_SECONDES: ${SESSION_INACTIVITE_ADMIN_SECONDES:-7200}
      SESSION_INACTIVITE_COUREUR_BENEVOLE_SECONDES: ${SESSION_INACTIVITE_COUREUR_BENEVOLE_SECONDES:-43200}
      # Calculs Argon2id simultanes (~19 Mio chacun) ; au-dela, 503 SERVICE_SATURE (entier >= 1).
      HACHAGE_CONCURRENCE_MAX: ${HACHAGE_CONCURRENCE_MAX:-4}
      # Plafond par adresse cliente, avant le plafond global : une IP n'occupe jamais toutes les places (entier >= 1).
      HACHAGE_CONCURRENCE_MAX_PAR_IP: ${HACHAGE_CONCURRENCE_MAX_PAR_IP:-1}
      # Drapeau Secure des cookies de session et CSRF (true/false) : false en dev et E2E (HTTP), true impose en prod.
      COOKIES_SECURE: ${COOKIES_SECURE:-false}
      # Limite de debit des routes publiques (GET /api/courses/**), par IP et par minute ; 0 = aucune limite.
      BACKYARD_LIMITE_DEBIT_PUBLIC_PAR_MINUTE: ${BACKYARD_LIMITE_DEBIT_PUBLIC_PAR_MINUTE:-1200}
      # Seul pair dont le X-Forwarded-For compte (limite de debit, plafonds de hachage et d'echecs de connexion par IP) :
      # le service web (Caddy).
      # Valeur fixe.
      BACKYARD_PROXY_DE_CONFIANCE: web
      # Admin master cree au premier demarrage (facultatives en dev, obligatoires en production).
      ADMIN_MASTER_PSEUDO: ${ADMIN_MASTER_PSEUDO:-}
      ADMIN_MASTER_MOT_DE_PASSE: ${ADMIN_MASTER_MOT_DE_PASSE:-}
    depends_on:
      base:
        condition: service_healthy
    # Publie en dev pour le test manuel ; retire en production par docker-compose.prod.yml.
    ports:
      - "8080:8080"
    healthcheck:
      # L'image JRE ne contient ni curl ni wget : requete HTTP via bash et /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8080
          && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    build:
      context: ./frontend
    logging: *journaux
    depends_on:
      api:
        condition: service_healthy
    # Point d'entree unique : Caddy sert le front et relaie /api vers api:8080.
    # En production, docker-compose.prod.yml ajoute 443 (HTTPS) et le redemarrage automatique.
    ports:
      - "80:80"
    healthcheck:
      # Porte sur la page d'accueil servie par Caddy, pas sur l'API.
      # Remplace en production (le port 80 y redirige vers HTTPS).
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  donnees-postgres:
