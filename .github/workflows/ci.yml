name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Réutilisé par release.yml : aucune image n'est publiée si un job échoue.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Le back est réparti en deux jobs parallèles (unitaires, intégration) qui produisent chacun un fichier
  # d'exécution JaCoCo ; le job `back` les fusionne et applique le contrôle de couverture du pom.
  back-unitaires:
    name: back-unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Tests unitaires (*Test, surefire) et règles ArchUnit ; target/jacoco.exec alimenté par l'agent JaCoCo.
      - name: Tests unitaires et ArchUnit
        run: ./mvnw -B test
        working-directory: backend
      - name: Publier le fichier d'exécution JaCoCo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-exec-unitaires
          path: backend/target/jacoco.exec
          if-no-files-found: error
          retention-days: 1

  back-integration:
    name: back-integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Tests d'intégration (*IntegrationTest, failsafe, Testcontainers) sans rejouer les tests unitaires :
      # test-compile exécute initialize (agent JaCoCo, chemin de l'agent Mockito), puis failsafe est appelé
      # directement avec sa configuration du pom. Pas de phase verify ici : le contrôle est fait par `back`.
      - name: Tests d'intégration
        run: ./mvnw -B test-compile failsafe:integration-test failsafe:verify
        working-directory: backend
      - name: Publier le fichier d'exécution JaCoCo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-exec-integration
          path: backend/target/jacoco.exec
          if-no-files-found: error
          retention-days: 1

  # Point de contrôle agrégé : conserve le nom `back` du check historique (protection de branche, release.yml).
  back:
    name: back
    needs: [back-unitaires, back-integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Vérifier le résultat des tests back
        env:
          UNITAIRES: ${{ needs.back-unitaires.result }}
          INTEGRATION: ${{ needs.back-integration.result }}
        run: |
          echo "back-unitaires=${UNITAIRES} back-integration=${INTEGRATION}"
          test "$UNITAIRES" = "success" && test "$INTEGRATION" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Récupérer le fichier d'exécution des tests unitaires
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jacoco-exec-unitaires
          path: backend/target/jacoco-ci/unitaires
      - name: Récupérer le fichier d'exécution des tests d'intégration
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jacoco-exec-integration
          path: backend/target/jacoco-ci/integration
      # Fusion (exécution fusion-ci du pom), puis les exécutions rapport et controle-seuils du pom : mêmes
      # seuils (jacoco.seuil.*) et même exclusion (jacoco.exclusions) que ./mvnw verify. Les classes sont
      # recompilées : si elles ne correspondent pas à celles exécutées par les tests, JaCoCo ignorerait leur
      # couverture en silence, d'où l'échec explicite sur son avertissement « do not match ».
      - name: Fusionner et contrôler la couverture (85 % lignes et branches)
        run: |
          set -o pipefail
          ./mvnw -B compile jacoco:merge@fusion-ci jacoco:report@rapport jacoco:check@controle-seuils | tee couverture.log
          if grep -q "do not match" couverture.log; then
            echo "::error::Classes compilées différentes de celles exécutées par les tests : couverture non fiable."
            exit 1
          fi
        working-directory: backend
      - name: Publier le rapport JaCoCo
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-rapport
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  front:
    name: front
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build -- --configuration production
        working-directory: frontend

  # Chaque entrée de la matrice a sa propre stack docker sur son propre runner : les tests qui avancent
  # l'horloge globale (projet `horloge`) n'interfèrent donc pas avec les autres. Les shards se partagent
  # les projets chromium et camera (les noms de données sont uniques par test).
  e2e-tests:
    name: e2e (${{ matrix.nom }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: shard 1/3
            artefact: shard-1
            commande: npx playwright test --project=chromium --project=camera --grep-invert "base neuve" --shard=1/3
          - nom: shard 2/3
            artefact: shard-2
            commande: npx playwright test --project=chromium --project=camera --grep-invert "base neuve" --shard=2/3
          - nom: shard 3/3
            artefact: shard-3
            commande: npx playwright test --project=chromium --project=camera --grep-invert "base neuve" --shard=3/3
          - nom: pwa
            artefact: pwa
            commande: npx playwright test --project=pwa --no-deps --workers=1
          - nom: horloge
            artefact: horloge
            commande: npx playwright test --project=horloge --no-deps --workers=1
    env:
      # Valeurs de test explicites, sans lien avec un environnement réel (aucun secret requis).
      ADMIN_MASTER_PSEUDO: admin-e2e
      ADMIN_MASTER_MOT_DE_PASSE: mot-de-passe-e2e-ci-2026
      E2E_ADMIN_MASTER_PSEUDO: admin-e2e
      E2E_ADMIN_MASTER_MOT_DE_PASSE: mot-de-passe-e2e-ci-2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build des images api/web via bake, avec cache de couches GitHub Actions ; le override e2e
      # ne change que l'environnement, les images sont donc identiques à celles de la production.
      - name: Construire les images (cache buildx)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: docker-compose.yml
          load: true
          # Noms d'images attendus par `docker compose` (projet backyard-ultra-tracker).
          set: |
            api.tags=backyard-ultra-tracker-api:latest
            web.tags=backyard-ultra-tracker-web:latest
            *.cache-from=type=gha,scope=e2e
            *.cache-to=type=gha,scope=e2e,mode=max
      - name: Démarrer la stack e2e
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --no-build --wait
      - name: Installer les dépendances e2e
        run: npm ci
        working-directory: e2e
      - name: Lire la version de Playwright
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: e2e
      - name: Cache des navigateurs Playwright
        id: cache-navigateurs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Installer Chromium
        if: steps.cache-navigateurs.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Installer les dépendances système de Chromium
        if: steps.cache-navigateurs.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: e2e
      # Équivalent réparti de `npm test` (voir e2e/README.md).
      - name: Lancer les tests Playwright (${{ matrix.nom }})
        run: ${{ matrix.commande }}
        working-directory: e2e
      - name: Récupérer les logs docker compose
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color > docker-compose.log
      - name: Publier le rapport Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.artefact }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publier les logs docker compose
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-compose-logs-${{ matrix.artefact }}
          path: docker-compose.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Arrêter la stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

  # Point de contrôle unique : conserve le nom `e2e` du check historique.
  e2e:
    name: e2e
    needs: e2e-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier le résultat des tests e2e
        run: test "${{ needs.e2e-tests.result }}" = "success"
