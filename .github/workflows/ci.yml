name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  back:
    name: back
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Tests unitaires, intégration (Testcontainers), JaCoCo 85 %, ArchUnit.
      - run: ./mvnw -B verify
        working-directory: backend

  front:
    name: front
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build -- --configuration production
        working-directory: frontend

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Valeurs de test explicites, sans lien avec un environnement réel (aucun secret requis).
      ADMIN_MASTER_PSEUDO: admin-e2e
      ADMIN_MASTER_MOT_DE_PASSE: mot-de-passe-e2e-ci-2026
      E2E_ADMIN_MASTER_PSEUDO: admin-e2e
      E2E_ADMIN_MASTER_MOT_DE_PASSE: mot-de-passe-e2e-ci-2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Démarrer la stack e2e
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
      - name: Installer Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: e2e
      # `npm test` enchaîne les projets chromium/camera puis horloge (voir e2e/README.md).
      - name: Lancer les tests Playwright
        run: npm test
        working-directory: e2e
      - name: Récupérer les logs docker compose
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color > docker-compose.log
      - name: Publier le rapport Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publier les logs docker compose
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-compose-logs
          path: docker-compose.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Arrêter la stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
