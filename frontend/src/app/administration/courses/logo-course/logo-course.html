@let c = course();
@let e = etatAffiche();
@if (c.logoUrl; as url) {
  <img class="visuel" [src]="url" [alt]="'Logo de ' + c.nom" data-testid="course-logo" />
} @else {
  <!-- Visuel décoratif ; seul le texte masqué « Aucun logo » est lu. -->
  <span class="visuel visuel-substitution" data-testid="course-logo-absent"
    ><span class="masque">Aucun logo</span></span
  >
}

@if (modifiable()) {
  <div class="logo__actions">
    <input
      #champLogo
      type="file"
      class="masque"
      accept="image/png,image/jpeg,image/webp"
      tabindex="-1"
      aria-hidden="true"
      (change)="choisir(champLogo)"
      data-testid="course-champ-logo"
    />
    <button
      type="button"
      class="ligne__action"
      [disabled]="envoiEnCours()"
      [attr.aria-label]="'Choisir un logo pour la course ' + c.nom"
      (click)="champLogo.click()"
      data-testid="course-bouton-logo"
    >
      Choisir un logo
    </button>
    @if (c.logoUrl !== null) {
      <button
        type="button"
        class="ligne__action"
        [disabled]="envoiEnCours()"
        [attr.aria-label]="'Supprimer le logo de la course ' + c.nom"
        (click)="supprimer()"
        data-testid="course-bouton-logo-supprimer"
      >
        Supprimer le logo
      </button>
    }
  </div>
}

@if (e.erreur; as message) {
  <p class="logo__erreur" role="alert" data-testid="course-logo-erreur">{{ message }}</p>
}

@if (modifiable() && e.fichier !== null) {
  <div class="apercu" role="group" [attr.aria-label]="'Nouveau logo de la course ' + c.nom">
    @if (e.apercu; as apercu) {
      <img
        class="vignette"
        [src]="apercu"
        [alt]="'Aperçu du nouveau logo de ' + c.nom"
        data-testid="course-logo-apercu"
      />
      <button
        type="button"
        class="ligne__action"
        [disabled]="envoiEnCours()"
        (click)="envoyer()"
        data-testid="course-bouton-logo-envoyer"
      >
        Envoyer le logo
      </button>
    } @else {
      <p class="apercu__lecture" role="status">Lecture du fichier…</p>
    }
    <button
      type="button"
      class="ligne__action"
      [disabled]="envoiEnCours()"
      (click)="annuler()"
      data-testid="course-bouton-logo-annuler"
    >
      Annuler
    </button>
  </div>
}
