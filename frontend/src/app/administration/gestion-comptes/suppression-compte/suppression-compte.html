@let c = compte();
@let p = prefixe() + '-suppression';
@let idTexte = p + '-confirmation-texte-' + c.id;
<button
  #boutonSupprimer
  type="button"
  class="ligne__action ligne__action--danger"
  [disabled]="envoiEnCours()"
  [attr.aria-label]="'Supprimer le compte ' + c.pseudo"
  [attr.aria-expanded]="ouverte()"
  (click)="ouvrir.emit()"
  [attr.data-testid]="prefixe() + '-bouton-supprimer'"
>
  Supprimer
</button>

@if (ouverte()) {
  <div
    class="confirmation"
    role="group"
    [attr.aria-labelledby]="idTexte"
    (keydown.escape)="annuler()"
    [attr.data-testid]="p + '-confirmation'"
  >
    <p [id]="idTexte" class="confirmation__texte" [attr.data-testid]="p + '-confirmation-texte'">
      {{ texteConfirmation() }}
    </p>
    <div class="confirmation__actions">
      <button
        type="button"
        class="ligne__action ligne__action--danger-plein"
        [disabled]="envoiEnCours()"
        (click)="confirmer()"
        [attr.data-testid]="p + '-bouton-confirmer'"
      >
        Confirmer la suppression
      </button>
      <button
        #boutonAnnuler
        type="button"
        class="ligne__action"
        [disabled]="envoiEnCours()"
        (click)="annuler()"
        [attr.data-testid]="p + '-bouton-annuler'"
      >
        Annuler
      </button>
    </div>
  </div>
}
