<header class="entete" [class.entete--menu]="session.etat() !== 'INCONNU'">
  <a class="entete__titre" routerLink="/" data-testid="entete-titre">Backyard Ultra Tracker</a>

  <!-- Une instance par état : un changement de session détruit le menu et le recrée fermé. -->
  <div class="entete__compte">
    @switch (session.etat()) {
      @case ('ANONYME') {
        <app-menu-burger
          nomPanneau="Menu visiteur"
          testidPanneau="menu-visiteur"
          [entrees]="entreesVisiteur"
        />
      }
      @case ('CONNECTE') {
        <app-menu-burger
          nomPanneau="Menu utilisateur"
          testidPanneau="menu-compte"
          [pseudo]="session.compte()?.pseudo ?? null"
          [entrees]="entreesCompte()"
          [actionEnCours]="envoiEnCours()"
          (action)="executer($event)"
        />
      }
    }
  </div>

  @if (confirmation(); as message) {
    <div
      class="entete__confirmation message--avertissement"
      role="alert"
      (keydown.escape)="resterConnecte()"
      data-testid="entete-deconnexion-confirmation"
    >
      <p class="message-pictogramme pictogramme-attente">{{ message }}</p>
      <div class="entete__actions">
        <button
          #rester
          type="button"
          class="bouton"
          (click)="resterConnecte()"
          data-testid="entete-deconnexion-annuler"
        >
          Rester connecté
        </button>
        <button
          type="button"
          class="bouton bouton--secondaire"
          (click)="confirmerDeconnexion()"
          data-testid="entete-deconnexion-confirmer"
        >
          Me déconnecter quand même
        </button>
      </div>
    </div>
  }

  @if (erreur(); as message) {
    <p class="entete__erreur" role="alert" data-testid="entete-erreur">{{ message }}</p>
  }
</header>
