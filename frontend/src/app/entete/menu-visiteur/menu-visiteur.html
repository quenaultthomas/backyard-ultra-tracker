<button
  #bouton
  type="button"
  id="entete-menu-bouton"
  class="menu-visiteur__bouton"
  aria-label="Menu du compte"
  aria-controls="entete-menu-panneau"
  [attr.aria-expanded]="ouvert()"
  (click)="basculer()"
  data-testid="bouton-menu"
>
  <svg
    viewBox="0 0 24 24"
    width="24"
    height="24"
    aria-hidden="true"
    focusable="false"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <circle cx="12" cy="8" r="4" />
    <path d="M4 21a8 8 0 0 1 16 0" />
  </svg>
</button>

<nav
  id="entete-menu-panneau"
  class="menu-visiteur__panneau"
  aria-label="Menu visiteur"
  [hidden]="!ouvert()"
  data-testid="menu-visiteur"
>
  <ul class="menu-visiteur__liste">
    <li>
      <a
        #premiereEntree
        class="menu-visiteur__lien"
        routerLink="/connexion"
        routerLinkActive="menu-visiteur__lien--courant"
        ariaCurrentWhenActive="page"
        (click)="fermer()"
        data-testid="menu-lien-se-connecter"
        >Se connecter</a
      >
    </li>
    <!-- Espace conservé entre les entrées : textContent « Se connecter Créer un compte ». -->
    &ngsp;
    <li>
      <a
        class="menu-visiteur__lien"
        routerLink="/creer-compte"
        routerLinkActive="menu-visiteur__lien--courant"
        ariaCurrentWhenActive="page"
        (click)="fermer()"
        data-testid="menu-lien-creer-compte"
        >Créer un compte</a
      >
    </li>
  </ul>
</nav>
