<main class="accueil decor-backyard">
  <h1 class="titre" data-testid="titre">Backyard Ultra Tracker</h1>
  <p class="accroche" data-testid="accroche">Une boucle après l'autre, jusqu'au dernier debout.</p>
  <nav class="actions" aria-label="Actions" data-testid="accueil-actions">
    @for (entree of entrees(); track entree.testid) {
      <a
        class="bouton action"
        [class.bouton--secondaire]="!entree.principale"
        [routerLink]="entree.route"
        [attr.data-testid]="entree.testid"
      >
        {{ entree.libelle }}
      </a>
    }
  </nav>
</main>
