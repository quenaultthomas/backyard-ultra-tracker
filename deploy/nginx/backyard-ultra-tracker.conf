# Site nginx du Backyard Ultra Tracker (reverse proxy devant Spring Boot, qui écoute sur 127.0.0.1:8080).
# Installation par l'exploitant : copier dans /etc/nginx/sites-available/, lier dans sites-enabled/, adapter
# server_name et les chemins des certificats, puis « nginx -t && systemctl reload nginx ».
# Ce fichier est inclus dans le contexte http : les directives limit_req_zone y sont donc permises.

# ── Limitation des tentatives (RG23 inc. 5) ────────────────────────────────────────────────────────────────
# Deux zones distinctes, par adresse IP du client : l'épuisement de l'une n'affecte jamais l'autre.
# Rien n'est compté dans l'application.
#   - inscription publique (E3)       : 10 requêtes par minute, rafale de 5, nodelay
#                                        (6 requêtes simultanées passent, la 7e reçoit 429, puis 1 toutes les 6 s) ;
#   - espace coureur /api/account/**  : 30 requêtes par minute, rafale de 10, nodelay
#                                        (11 requêtes simultanées passent, la 12e reçoit 429, puis 1 toutes les 2 s).
limit_req_zone $binary_remote_addr zone=backyard_registration:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=backyard_account:10m rate=30r/m;
limit_req_status 429;

upstream backyard_app {
    server 127.0.0.1:8080;
}

# HTTP : redirection permanente vers HTTPS (RG34 inc. 3).
server {
    listen 80;
    listen [::]:80;
    server_name backyard.example.org;

    access_log /var/log/nginx/backyard-ultra-tracker.access.log;
    error_log /var/log/nginx/backyard-ultra-tracker.error.log;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name backyard.example.org;

    ssl_certificate /etc/letsencrypt/live/backyard.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backyard.example.org/privkey.pem;

    # HSTS posé par le reverse proxy (RG34 inc. 3, RG55 inc. 4).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Journaux conservés 7 jours au plus (RG22 inc. 5) : rotation par deploy/logrotate/nginx-backyard-ultra-tracker.
    access_log /var/log/nginx/backyard-ultra-tracker.access.log;
    error_log /var/log/nginx/backyard-ultra-tracker.error.log;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Inscription publique avec création de compte (E3) : zone « inscription ».
    location ~ ^/api/public/races/[^/]+/registrations$ {
        limit_req zone=backyard_registration burst=5 nodelay;
        proxy_pass http://backyard_app;
    }

    # Espace coureur (E20, E21, E23) : zone « compte ».
    location /api/account/ {
        limit_req zone=backyard_account burst=10 nodelay;
        proxy_pass http://backyard_app;
    }

    # Tout le reste (API publique, scan, admin, PWA) : aucune limitation à cet incrément.
    location / {
        proxy_pass http://backyard_app;
    }
}
