# Conservation de la sortie console capturée par journald quand l'application est lancée par systemd
# (RG22 inc. 5) : 7 jours au plus.
# Installation par l'exploitant : copier dans /etc/systemd/journald.conf.d/backyard-ultra-tracker.conf,
# puis « systemctl restart systemd-journald ».
# Attention : journald n'a qu'une durée de conservation globale ; ce réglage s'applique à tout le journal du VPS.
[Journal]
MaxRetentionSec=7day
